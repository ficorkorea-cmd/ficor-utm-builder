<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FICOR UTM 빌더</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">FICOR</span>
        <span class="brand-name">UTM 빌더</span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="build" role="tab">URL 생성</button>
        <button class="tab" data-tab="inspect" role="tab">URL 검사</button>
        <button class="tab" data-tab="history" role="tab">생성 기록</button>
        <button class="tab" data-tab="guide" role="tab">작성 가이드</button>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <!-- ① URL 생성 -->
    <section class="panel is-active" id="tab-build">
      <div class="build-grid">
        <form class="form block" id="buildForm" autocomplete="off" onsubmit="return false">

          <label class="field">
            <span class="label"><span class="step">1</span>랜딩 URL</span>
            <input type="url" id="landing" placeholder="https://ficor.kr/...">
            <span class="dest" id="destBadge"></span>
          </label>

          <label class="field">
            <span class="label"><span class="step">2</span>어디에 거는 링크인가요?</span>
            <select id="channel"><option value="">매체 선택</option></select>
            <span class="hint" id="channelInfo"></span>
          </label>

          <label class="field" id="customSourceWrap" hidden>
            <span class="label">크리에이터 ID</span>
            <input type="text" id="customSource" placeholder="영문 소문자 (예: fit_jenny)">
          </label>

          <label class="check" id="metaModeWrap" hidden>
            <input type="checkbox" id="metaMode">
            <span><b>광고관리자 'URL 매개변수' 칸용으로 만들기</b><br><small>캠페인·광고 이름이 자동으로 들어갑니다</small></span>
          </label>

          <div class="field">
            <span class="label"><span class="step">3</span>캠페인 <code>프로모션_상품_시작일</code></span>
            <div class="row three">
              <select id="cPromotion" aria-label="프로모션"></select>
              <select id="cProduct" aria-label="상품"></select>
              <input type="date" id="cDate" aria-label="시작일">
            </div>
          </div>

          <label class="field" id="contentWrap">
            <span class="label"><span class="step">4</span>소재명 <em class="req" id="contentReq">선택</em></span>
            <div class="prefix-input">
              <span class="prefix" id="contentPrefix" hidden></span>
              <input type="text" id="content" placeholder="예: video_doctor">
            </div>
            <span class="hint" id="contentHint">영문으로 입력 (한글·공백은 자동 정리)</span>
          </label>
        </form>

        <!-- 결과 -->
        <aside class="result">
          <div class="result-card">
            <div class="result-head">
              <h2 id="resultTitle">완성 URL</h2>
              <span class="status" id="statusBadge"></span>
            </div>
            <div class="url-out" id="urlOut"><span class="placeholder">왼쪽 항목을 채우면 여기에 URL이 만들어집니다.</span></div>
            <div id="metaOut" hidden>
              <div class="mini-label">웹사이트 URL 칸</div>
              <div class="url-out small" id="metaWebsite"></div>
              <div class="mini-label">URL 매개변수 칸</div>
              <div class="url-out small" id="metaParams"></div>
            </div>
            <ul class="checks" id="checkList"></ul>
            <div class="actions">
              <button type="button" class="btn primary" id="copyBtn" disabled>URL 복사</button>
              <button type="button" class="btn" id="shortBtn" disabled>단축 URL</button>
              <button type="button" class="btn" id="qrBtn" disabled>QR</button>
            </div>
            <div class="short-out" id="shortOut" hidden>
              <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
              <button type="button" class="btn small primary" id="shortCopy">복사</button>
            </div>
            <div class="qr-box" id="qrBox" hidden>
              <div id="qrImg"></div>
              <button type="button" class="btn small" id="qrDownload">PNG 저장</button>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ② URL 검사 -->
    <section class="panel" id="tab-inspect">
      <div class="card">
        <h2 class="sec">URL 검사</h2>
        <p class="lead">이미 배포된 링크를 붙여넣으면 규칙에 맞지 않는 부분만 알려줍니다.</p>
        <div class="row">
          <input type="text" id="inspectInput" placeholder="https://ficor.kr/?utm_source=...">
          <button type="button" class="btn primary" id="inspectBtn">검사</button>
        </div>
        <div id="inspectOut"></div>
      </div>
    </section>

    <!-- ③ 생성 기록 -->
    <section class="panel" id="tab-history">
      <div class="card">
        <div class="hist-head">
          <h2 class="sec">생성 기록</h2>
          <div class="hist-tools">
            <input type="search" id="histSearch" placeholder="검색">
            <button type="button" class="btn" id="histCsv">CSV</button>
            <button type="button" class="btn ghost danger" id="histClear">전체 삭제</button>
          </div>
        </div>
        <p class="lead">복사한 링크가 자동 저장됩니다. 이 브라우저에만 보관됩니다.</p>
        <div id="histOut"></div>
      </div>
    </section>

    <!-- ④ 작성 가이드 -->
    <section class="panel" id="tab-guide">
      <article class="card guide" id="guideOut"></article>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <script src="presets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
  <script src="rules.js"></script>
  <script src="guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
