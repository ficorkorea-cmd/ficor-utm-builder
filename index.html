<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FICOR UTM 빌더</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">FICOR</span>
        <span class="brand-name">UTM 빌더</span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="build" role="tab">URL 생성</button>
        <button class="tab" data-tab="inspect" role="tab">URL 검사</button>
        <button class="tab" data-tab="history" role="tab">생성 기록</button>
        <button class="tab" data-tab="guide" role="tab">작성 가이드</button>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <!-- ① URL 생성 -->
    <section class="panel is-active" id="tab-build">
      <div class="build-grid">
        <form class="form block" id="buildForm" autocomplete="off" onsubmit="return false">

          <label class="field">
            <span class="label"><span class="step">1</span>랜딩 URL <em class="req on">필수</em></span>
            <input type="url" id="landing" placeholder="https://ficor.kr/...">
            <span class="dest" id="destBadge"></span>
          </label>

          <div class="field">
            <label class="label" for="channel"><span class="step">2</span>링크를 거는 위치 <em class="req on">필수</em></label>
            <select id="channel"></select>
            <span class="hint" id="channelInfo"></span>
            <div class="notice" id="blockedNotice" hidden></div>
          </div>

          <label class="field" id="customSourceWrap" hidden>
            <span class="label">크리에이터 ID <em class="req on">필수</em></span>
            <input type="text" id="customSource" placeholder="영문 소문자 (예: fit_jenny)">
          </label>

          <label class="check" id="metaModeWrap" hidden>
            <input type="checkbox" id="metaMode">
            <span><b>광고관리자 'URL 매개변수' 칸용으로 만들기</b><br><small>캠페인 · 광고세트 · 광고 이름이 자동으로 들어갑니다 (이름은 아래 규칙대로 작성)</small></span>
          </label>

          <div class="field" id="campaignWrap">
            <span class="label"><span class="step">3</span>캠페인 <code>시작일_목적_프로모션_상품</code></span>
            <div class="row four">
              <label class="sub"><small>시작일</small><input type="date" id="cDate"></label>
              <label class="sub"><small>목적</small><select id="cObjective"></select></label>
              <label class="sub"><small>프로모션</small><select id="cPromotion"></select></label>
              <label class="sub"><small>상품 (선택)</small><select id="cProduct"></select></label>
            </div>
            <span class="hint">기본값이 채워져 있어 특별한 캠페인이 아니면 그대로 두면 됩니다.</span>
          </div>

          <div class="field" id="contentWrap">
            <span class="label"><span class="step">4</span>소재 <code>소재명_형식</code> <em class="req" id="contentReq">선택</em></span>
            <div class="row two-one">
              <label class="sub"><small>소재명 (영문)</small><input type="text" id="cName" placeholder="예: doctor, review, price"></label>
              <label class="sub"><small>형식</small><select id="cFormat"></select></label>
            </div>
            <span class="hint" id="contentHint"></span>
          </div>

          <div class="field" id="termWrap" hidden>
            <span class="label"><span class="step">5</span><span id="termTitle">타겟</span> <em class="req">선택</em></span>
            <div class="row two-one" id="termTargetRow">
              <label class="sub"><small>타겟 유형</small><select id="tType"></select></label>
              <label class="sub"><small>세부 (영문)</small><input type="text" id="tDetail" placeholder="예: purchase, cart_7d"></label>
            </div>
            <label class="sub" id="termKeywordRow" hidden><small>검색 키워드</small><input type="text" id="tKeyword" placeholder="예: 손목보호대"></label>
          </div>
        </form>

        <!-- 결과 -->
        <aside class="result">
          <div class="result-card">
            <div class="result-head">
              <h2 id="resultTitle">완성 URL</h2>
              <span class="status" id="statusBadge"></span>
            </div>
            <div class="url-out" id="urlOut"><span class="placeholder">왼쪽 항목을 채우면 여기에 URL이 만들어집니다.</span></div>
            <div id="metaOut" hidden>
              <div class="mini-label">웹사이트 URL 칸</div>
              <div class="url-out small" id="metaWebsite"></div>
              <div class="mini-label">URL 매개변수 칸</div>
              <div class="url-out small" id="metaParams"></div>
            </div>
            <ul class="checks" id="checkList"></ul>
            <div class="actions">
              <button type="button" class="btn primary" id="copyBtn" disabled>URL 복사</button>
              <button type="button" class="btn" id="shortBtn" disabled>단축 URL</button>
              <button type="button" class="btn" id="qrBtn" disabled>QR</button>
            </div>
            <div class="short-out" id="shortOut" hidden>
              <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
              <button type="button" class="btn small primary" id="shortCopy">복사</button>
            </div>
            <div class="qr-box" id="qrBox" hidden>
              <div id="qrImg"></div>
              <button type="button" class="btn small" id="qrDownload">PNG 저장</button>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ② URL 검사 -->
    <section class="panel" id="tab-inspect">
      <div class="card">
        <h2 class="sec">URL 검사</h2>
        <p class="lead">이미 배포된 링크를 붙여넣으면 규칙에 맞지 않는 부분만 알려줍니다.</p>
        <div class="row">
          <input type="text" id="inspectInput" placeholder="https://ficor.kr/?utm_source=...">
          <button type="button" class="btn primary" id="inspectBtn">검사</button>
        </div>
        <div id="inspectOut"></div>
      </div>
    </section>

    <!-- ③ 생성 기록 -->
    <section class="panel" id="tab-history">
      <div class="card">
        <div class="hist-head">
          <h2 class="sec">생성 기록</h2>
          <div class="hist-tools">
            <input type="search" id="histSearch" placeholder="검색">
            <button type="button" class="btn" id="histCsv">CSV</button>
            <button type="button" class="btn ghost danger" id="histClear">전체 삭제</button>
          </div>
        </div>
        <p class="lead">복사한 링크가 자동 저장됩니다. 이 브라우저에만 보관됩니다.</p>
        <div id="histOut"></div>
      </div>
    </section>

    <!-- ④ 작성 가이드 -->
    <section class="panel" id="tab-guide">
      <article class="card guide" id="guideOut"></article>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <script src="presets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
  <script src="rules.js"></script>
  <script src="guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
